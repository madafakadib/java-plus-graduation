server:
  port: 8080

spring:
  application:
    name: gateway-server

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      default-filters:
        - name: Retry
          args:
            retries: 3
            statuses:
              - NOT_FOUND
              - SERVICE_UNAVAILABLE
              - GATEWAY_TIMEOUT
        - name: CircuitBreaker
          args:
            name: gatewayCircuitBreaker
            fallbackUri: forward:/fallback
        - name: DedupeResponseHeader
          args:
            name: Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - name: AddResponseHeader
          args:
            name: Access-Control-Allow-Methods
            value: GET,POST,PUT,PATCH,DELETE,OPTIONS
        - name: AddResponseHeader
          args:
            name: Access-Control-Allow-Headers
            value: Origin, Content-Type, Accept, Authorization, X-Requested-With, X-HTTP-Method-Override
        - name: AddResponseHeader
          args:
            name: Access-Control-Allow-Origin
            value: "*"

      httpclient:
        connect-timeout: 3000
        response-timeout: 10s

      routes:
        # ==================== МАРШРУТЫ ДЛЯ EVENT-SERVICE ====================

        # 1. Админ события
        - id: admin-events
          uri: lb://event-service
          predicates:
            - Path=/admin/events/**
            - Method=GET,POST,PUT,PATCH,DELETE
          filters:
            - StripPrefix=0

        # 2. Админ категории
        - id: admin-categories
          uri: lb://event-service
          predicates:
            - Path=/admin/categories/**
            - Method=GET,POST,PUT,DELETE
          filters:
            - StripPrefix=0

        # 3. Админ подборки
        - id: admin-compilations
          uri: lb://event-service
          predicates:
            - Path=/admin/compilations/**
            - Method=GET,POST,PUT,DELETE
          filters:
            - StripPrefix=0

        # 4. Приватные события пользователя (ВАЖНЫЙ МАРШРУТ)
        - id: private-user-events
          uri: lb://event-service
          predicates:
            - Path=/users/{userId}/events/**
            - Method=GET,POST,PATCH
          filters:
            - StripPrefix=0
            - name: SetRequestHeader
              args:
                name: X-HTTP-Method-Override
                value: PATCH

        # 5. Публичные события
        - id: public-events
          uri: lb://event-service
          predicates:
            - Path=/events/**
            - Method=GET
          filters:
            - StripPrefix=0

        # 6. Публичные категории
        - id: public-categories
          uri: lb://event-service
          predicates:
            - Path=/categories/**
            - Method=GET
          filters:
            - StripPrefix=0

        # 7. Публичные подборки
        - id: public-compilations
          uri: lb://event-service
          predicates:
            - Path=/compilations/**
            - Method=GET
          filters:
            - StripPrefix=0

        # ==================== МАРШРУТЫ ДЛЯ USER-SERVICE ====================

        # 8. Админ пользователи
        - id: admin-users
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**
            - Method=GET,POST,PUT,DELETE
          filters:
            - StripPrefix=0

        # ==================== МАРШРУТЫ ДЛЯ REQUEST-SERVICE ====================

        # 9. Приватные запросы пользователя
        - id: private-user-requests
          uri: lb://request-service
          predicates:
            - Path=/users/{userId}/requests/**
            - Method=GET,POST,PATCH
          filters:
            - StripPrefix=0

        # ==================== МАРШРУТЫ ДЛЯ COMMENT-SERVICE ====================

        # 10. Админ комментарии
        - id: admin-comments
          uri: lb://comment-service
          predicates:
            - Path=/admin/comments/**
            - Method=GET,PUT,DELETE
          filters:
            - StripPrefix=0

        # 11. Приватные комментарии пользователя
        - id: private-user-comments
          uri: lb://comment-service
          predicates:
            - Path=/users/{userId}/comments/**
            - Method=GET,POST,PUT,DELETE
          filters:
            - StripPrefix=0

        # 12. Публичные комментарии к событию
        - id: public-event-comments
          uri: lb://comment-service
          predicates:
            - Path=/events/{eventId}/comments
            - Method=GET
          filters:
            - StripPrefix=0

        # 13. Публичные комментарии по ID
        - id: public-comment
          uri: lb://comment-service
          predicates:
            - Path=/comments/{commentId}
            - Method=GET
          filters:
            - StripPrefix=0

        # ==================== FALLBACK МАРШРУТ ====================

        # 14. Fallback для ошибок
        - id: fallback
          uri: lb://event-service
          predicates:
            - Path=/fallback
          filters:
            - StripPrefix=0

# ==================== НАСТРОЙКИ RESILIENCE4J ====================

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 50
        failureRateThreshold: 50
        waitDurationInOpenState: 5000
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      gatewayCircuitBreaker:
        baseConfig: default

# ==================== НАСТРОЙКИ EUREKA ====================

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# ==================== НАСТРОЙКИ LOGGING ====================

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator: DEBUG
    org.springframework.cloud.gateway.handler: DEBUG
    org.springframework.web: DEBUG
    ru.practicum.gateway: DEBUG

# ==================== НАСТРОЙКИ MANAGEMENT ====================

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics
  endpoint:
    gateway:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}