server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      default-filters:
        - name: Retry
          args:
            retries: 3
            statuses:
              - NOT_FOUND
              - SERVICE_UNAVAILABLE
              - GATEWAY_TIMEOUT
        - name: DedupeResponseHeader
          args:
            name: Access-Control-Allow-Credentials Access-Control-Allow-Origin
      httpclient:
        connect-timeout: 5000
        response-timeout: 30s
      routes:
        # ============= USER SERVICE =============
        - id: user-service-admin
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: user-service-admin
                fallbackUri: forward:/fallback

        # ============= CATEGORY SERVICE =============
        - id: admin-category-service
          uri: lb://category-service
          predicates:
            - Path=/admin/categories/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: category-service-admin
                fallbackUri: forward:/fallback

        - id: public-category-service
          uri: lb://category-service
          predicates:
            - Path=/categories/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: category-service-public
                fallbackUri: forward:/fallback

        # ============= REQUEST SERVICE =============
        - id: request-service
          uri: lb://request-service
          predicates:
            - Path=/users/{userId}/requests/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: request-service
                fallbackUri: forward:/fallback

        # ============= COMPILATION SERVICE =============
        - id: admin-compilation-service
          uri: lb://compilation-service
          predicates:
            - Path=/admin/compilations/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: compilation-service-admin
                fallbackUri: forward:/fallback

        - id: public-compilation-service
          uri: lb://compilation-service
          predicates:
            - Path=/compilations/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: compilation-service-public
                fallbackUri: forward:/fallback

        # ============= COMMENT SERVICE =============
        - id: admin-comment-service
          uri: lb://comment-service
          predicates:
            - Path=/admin/comments/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: comment-service-admin
                fallbackUri: forward:/fallback

        - id: private-comment-service
          uri: lb://comment-service
          predicates:
            - Path=/users/**/comments/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: comment-service-private
                fallbackUri: forward:/fallback

        - id: public-comment-service
          uri: lb://comment-service
          predicates:
            - Path=/events/**/comments/**, /comments/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: comment-service-public
                fallbackUri: forward:/fallback

        # ============= EVENT SERVICE =============
        - id: admin-event-service
          uri: lb://event-service
          predicates:
            - Path=/admin/events/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: event-service-admin
                fallbackUri: forward:/fallback

        - id: private-event-service
          uri: lb://event-service
          predicates:
            - Path=/users/**/events/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: event-service-private
                fallbackUri: forward:/fallback

        - id: public-event-service
          uri: lb://event-service
          predicates:
            - Path=/events/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: event-service-public
                fallbackUri: forward:/fallback

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true