server:
  port: 0

spring:
  application:
    name: comment-service
  config:
    import: "configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        serviceId: config-server
      fail-fast: true # ?????????? ????? ??????, ???? ?????? ???????????? ???????? ??????????
      retry:
        useRandomPolicy: true  # ??? ????????? ??????? ????? ???????????? ????????? random exponential backoff
        max-interval: 6000 # ??????????? ????????? ???????? ????? ????????? ???????????.
        max-attempts: 10  # ??????? ??? ????????
        initial-interval: 1000  # ????????? ???????? ????? ?????????
        multiplier: 1.5  # ????????? ?????????? ????????

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true
    instance-id: "${spring.application.name}:${random.value}"  # ?????????? ID ??????????
    hostname: localhost